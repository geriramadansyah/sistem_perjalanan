<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">
  <div class="login-box">

    <h2>SISTEM PERJALAN</h2>
		<i>Pilih Role:</i>
    <div class="roleSelect">
      <button id="btnKurir" class="active" onclick="setRole('KURIR')">Kurir</button>
      <button id="btnPemesan" onclick="setRole('PEMESAN')">Pemesan</button>
    </div>

    <input id="username" placeholder="Nama Pengguna">
    <input id="password" type="password" placeholder="Kata Sandi">

    <button onclick="login()">
      <span id="textLogin">Masuk</span>
      <span id="spinnerLogin" class="spinner"></span>
    </button>

    <p id="errorLogin"></p>

  </div>
</div>

<script src="login.js"></script>
</body>
</html>
