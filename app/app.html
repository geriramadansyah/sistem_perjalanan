<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<body>

<div class="container" id="app" style="display:none;">

  <div class="topbar">
    <div id="namaUser">-</div>
    <div class="menuBtn" onclick="toggleMenu()">☰ </div>
  </div>

  <div id="menu" class="menu">
    <div onclick="showPage('input')">Pesanan</div>
    <div onclick="showPage('riwayat')">Riwayat</div>
	<div onclick="openLaporan()">Laporan</div>
	<div onclick="logout()"> ↺ Keluar</div>
  </div>

  <div class="content">

    <div id="inputPage" class="page active">

      <h3>Pesanan</h3>
      <div id="listHariIni" class="list"></div>
    </div>

    <div id="riwayatPage" class="page">
      <h2>Riwayat</h2>

      <div class="card">
		<div class="filterTanggal">
		  <span>pilih tanggal:</span>
		  <input type="date" id="tanggal" onchange="filterTanggal()">
		</div>
      </div>
		<div class="totalKMBox">
		  Total KM: <span id="totalKM">0</span> KM
		</div>

      <div id="listRiwayat" class="list"></div>
    </div>
	
	<div id="popup" class="popup" style="display:none;">
	  <div class="popupBox">
		<p id="popupText"></p>
	  </div>
	</div>
  </div>
  <div id="popupSelesai" class="popup" style="display:none;">
	  <div class="popupBox">

		<h3>Selesaikan Pesanan</h3>

		<input id="inputKetKurir" placeholder="Keterangan">
		<select id="inputParkir"></select>
		<button onclick="submitSelesai()">Kirim</button>
		<button onclick="closePopup()">Batal</button>

	  </div>
  </div>
    
  <div id="popupLaporan" class="popup" style="display:none;">
	  <div class="popupBox">

		<h3>Buat Laporan</h3>

		<select id="jenisLaporan">
		  <option value="">Pilih Jenis</option>
		  <option value="Bug Sistem">Bug Sistem</option>
		  <option value="Error Data">Error Data</option>
		  <option value="UI Bermasalah">UI Bermasalah</option>
		  <option value="Lainnya">Lainnya</option>
		</select>

		<input id="ketLaporan" placeholder="Keterangan laporan">

		<button onclick="kirimLaporan()">Kirim</button>
		<button onclick="closeLaporan()">Batal</button>

	  </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
