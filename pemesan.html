<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aplikasi pemesan</title>
<link rel="stylesheet" href="pemesan.css">
</head>

<body>

<body>

<div class="container" id="app" style="display:none;">

  <div class="topbar">
    <div id="namaUser">-</div>
    <div class="menuBtn" onclick="toggleMenu()">
      <svg viewBox="0 0 448 512" width="25">
        <path fill="white" d="M16 132h416c8.837 0 16-7.163 16-16V76c0-8.837-7.163-16-16-16H16C7.163 60 0 67.163 0 76v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16z"/>
      </svg>
    </div>
  </div>

  <div id="menu" class="menu">
    <div onclick="showPage('input')">PESANAN</div>
    <div onclick="showPage('riwayat')">RIWAYAT</div>
	<div onclick="logout()"> ↺ Keluar</div>
  </div>

  <div class="content">

    <div id="inputPage" class="page active">
      <h2>Pesan Sekarang</h2>

      <div class="card">

        <div style="position:relative;">
          <input id="rute" placeholder="Cari Rute" autocomplete="off">
          <div id="suggestions" class="suggestions"></div>
        </div>

        <input id="km" placeholder="KM" readonly>
        <input id="ket" placeholder="Keterangan">

        <select id="jenis">
          <option>Pengantaran</option>
          <option>Pengambilan</option>
        </select>

        <button onclick="kirim()">Kirim</button>
      </div>

      <h3>Pesanan Hari Ini</h3>
      <div id="listHariIni" class="list"></div>
    </div>

    <div id="riwayatPage" class="page">
      <h2>Riwayat</h2>

      <div class="card">
        <input type="date" id="tanggal" onchange="filterTanggal()">
      </div>

      <div id="listRiwayat" class="list"></div>
    </div>
	
	<div id="popup" class="popup" style="display:none;">
	  <div class="popupBox">
		<p id="popupText"></p>
	  </div>
	</div>
  </div>
</div>

<script src="pemesan.js"></script>
</body>
</html>
