<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="kurir.css">
<title>aplikasi kurir</title>
</head>

<body>

<div id="app">

  <div class="topbar">
    <span id="namaKurir"></span>
    <button onclick="logout()">↺ Keluar</button>
  </div>

  <div class="menu">
    <button id="btnPesanan" onclick="setMenu('pesanan')">PESANAN</button>
    <button id="btnDiambil" onclick="setMenu('diambil')">DIAMBIL</button>
  </div>

  <div class="tabDiambil" id="tabDiambil" style="display:none;">
    <button onclick="setTab('jalan')" id="btnJalan">Sedang Jalan</button>
    <button onclick="setTab('selesai')" id="btnSelesai">Selesai</button>
  </div>

  <div id="filterBar" class="filterBar" style="display:none;">
    <input type="date" id="tanggalFilter" onchange="render()">
    <div id="totalKM" class="totalKM"></div>
  </div>

  <div id="content"></div>
	<div id="popup" class="popup">
	  <div class="popup-content">
		<h3>Selesaikan Pesanan</h3>

		<label>Keterangan</label>
		<input type="text" id="inputKet" placeholder="Opsional">

		<label>Parkir (1-15)</label>
		<input type="number" id="inputParkir" min="0" max="15">

		<div class="popup-actions">
		  <button onclick="submitSelesai()" id="btnSubmit">
			<span id="textSubmit">Simpan</span>
			<span id="spinSubmit" class="spinner"></span>
		  </button>
		  <button onclick="closePopup()" class="btn-batal">Batal</button>
		</div>
	  </div>
	</div>
</div>

<script src="kurir.js"></script>
</body>
</html>
